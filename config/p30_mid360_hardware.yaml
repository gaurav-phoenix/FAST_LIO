/**:
    ros__parameters:
        feature_extract_enable: false
        # Mid density: denser than original (3/0.3/0.4), less solid than 1/0.1/0.1.
        point_filter_num: 2
        max_iteration: 4
        filter_size_surf: 0.15
        filter_size_map: 0.2
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        # Test 1 replay on Orin: three matching threads plus prompt sensor reception.
        diagnostics:
            enabled: true
        sensor_callbacks:
            concurrent: true
        # Experiment baseline. Override only reliability for the first QoS A/B.
        imu_subscription:
            reliability: reliable
            depth: 10
        map_file_path: "./p30_hardware_map.pcd"

        common:
            # hardware_drivers remaps Livox /livox/lidar → /livox/point_cloud
            lid_topic:  "/livox/point_cloud"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 4                # Mid360 PointCloud2 with Livox-specific fields (tag, line, timestamp)
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3            # 3 = nanoseconds (livox PointCloud2 absolute ns → ms via 1e-6)
            scan_rate: 10

        mapping:
            acc_cov: 0.05
            gyr_cov: 0.05
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            # This is LiDAR-to-Mid360-internal-IMU calibration, not the
            # physical 47° drone mount. The drone mount belongs in a separate
            # sensor-to-airframe TF.
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            # Live EV path: slam_tf_bridge owns map/odom/body TFs.
            publish_tf: false
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
