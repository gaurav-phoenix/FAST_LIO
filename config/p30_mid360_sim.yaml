/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1
        max_iteration: 3
        filter_size_surf: 0.8
        filter_size_map: 1.0

        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./p30_fastlio_map.pcd"

        common:
            lid_topic: "/slam/point_cloud"
            imu_topic: "/slam/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            # Gazebo publishes a generic PointCloud2 with x/y/z/intensity/ring.
            # Use the generic ring-aware path so FAST-LIO can reconstruct
            # intra-scan timing from azimuth ordering without expecting a
            # Velodyne/Livox-specific point layout.
            lidar_type: 5
            scan_line: 56
            # Radius, metres: FAST-LIO discards every return inside it
            # (preprocess.cpp tests x^2+y^2+z^2 > blind^2). 2.0 came in with the
            # lidar_type 5 generic-ring template, which is Velodyne-derived, and
            # is wrong for a Mid360 on a drone: p30_mid360_hardware.yaml and
            # upstream mid360.yaml both use 0.5 for this same sensor.
            #
            # Measured from rosbags/kino3d_20260819_112306: flying the maze the
            # median return is 1.8 m and drops to 1.3 m on descent, so 2.0
            # threw away 66% of every scan -- and specifically the near returns
            # that constrain the solution best. Retained fraction falls off a
            # cliff right at this value: 0.3/0.5/0.7/1.0 all keep 93%, 1.5 keeps
            # 88%, 2.0 keeps 34%. FAST-LIO then lost constraint and ran away to
            # -23 km in Z while PX4 held station, PGO followed it, and the
            # global map filled with garbage.
            #
            # 0.5 sits just outside the airframe (planning_cloud_adapter
            # self_radius is 0.45) and clear of the cliff.
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            # The simulated LiDAR mount is fixed and known. Estimating it online
            # with mismatched/sparse scan constraints only destabilizes the filter.
            extrinsic_est_en: false
            # Lidar pose expressed in the IMU (p30_base/body) frame. Must match
            # models/x500_livox_mid360/model.sdf and the p30_base ->
            # p30_mid360_lidar static TF in sim_world.launch.py, which are the
            # single source of truth for the mount:
            #   xyz (0.15901, 0, 0.03052), quat xyzw
            #   (0.259195581, 0.259195581, 0.657888783, 0.657888783)
            #
            # The previous value was a pure 47 deg pitch at (0, 0, -0.06): the
            # complement of the real 43 deg roll, applied about the wrong axis,
            # with the 90 deg yaw dropped. Net error 90.07 deg, so every scan
            # was registered a quarter turn away from where the filter believed
            # it pointed -- "No Effective Points!" and steady odometry drift.
            extrinsic_T: [0.15901, 0.0, 0.03052]
            extrinsic_R: [0.0, -0.731270603, 0.682087461,
                          1.0, 0.0, 0.0,
                          0.0, 0.682087461, 0.731270603]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
